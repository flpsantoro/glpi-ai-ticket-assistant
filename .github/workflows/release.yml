name: Release

# Push a tag such as v1.0.0: the archive ready to extract in GLPI's plugins/
# directory (folder "ticketassistant") is attached to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check that the tag matches the plugin version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "define('PLUGIN_TICKETASSISTANT_VERSION', '${VERSION}')" setup.php \
            || { echo "setup.php does not declare version ${VERSION}"; exit 1; }
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build the archives (files marked export-ignore are left out)
        run: |
          mkdir -p dist
          git archive --prefix=ticketassistant/ --format=tar HEAD | bzip2 > "dist/ticketassistant-${VERSION}.tar.bz2"
          git archive --prefix=ticketassistant/ --format=zip -o "dist/ticketassistant-${VERSION}.zip" HEAD
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Release notes from the changelog section of the version
        run: |
          # The section of the version, with its wrapped lines joined: release
          # notes keep every line break, a Markdown file does not
          awk -v version="[${VERSION}]" '
            /^## \[/ { if (found) exit; if (index($0, version)) { found = 1; next } }
            found { print }
          ' CHANGELOG.md | awk '
            function flush() { if (line != "") print line; line = "" }
            /^```/ { flush(); print; fenced = !fenced; next }
            fenced { print; next }
            /^[[:space:]]*$/ { flush(); print ""; next }
            /^#/ { flush(); print; next }
            /^(- |\* |[0-9]+\. )/ { flush(); line = $0; next }
            { sub(/^[[:space:]]+/, ""); line = (line == "" ? $0 : line " " $0) }
            END { flush() }
          ' > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || { echo "CHANGELOG.md has no section for ${VERSION}"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.VERSION }}
          files: dist/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
